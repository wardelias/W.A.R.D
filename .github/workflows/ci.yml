name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start -x studio,postgres-meta,supavisor,imgproxy,vector,logflare
      - name: Export local Supabase keys
        run: |
          pnpm exec supabase status -o env | grep -E '^(PUBLISHABLE_KEY|SECRET_KEY)=' \
            | sed -e 's/"//g' -e 's/^PUBLISHABLE_KEY=/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=/' -e 's/^SECRET_KEY=/SUPABASE_SECRET_KEY=/' >> "$GITHUB_ENV"
      - run: pnpm test:db

  e2e:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      ALLOWED_EMAILS: e2e@ward.local
      # Test-only values; never used outside CI.
      CRON_SECRET: ci-only-cron-secret-0123456789abcdef0123
      TOKEN_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      CALENDAR_PROVIDER: fake
      E2E_TEST_ROUTES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start -x studio,postgres-meta,supavisor,imgproxy,vector,logflare
      - name: Export local Supabase keys
        run: |
          pnpm exec supabase status -o env | grep -E '^(PUBLISHABLE_KEY|SECRET_KEY)=' \
            | sed -e 's/"//g' -e 's/^PUBLISHABLE_KEY=/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=/' -e 's/^SECRET_KEY=/SUPABASE_SECRET_KEY=/' >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
